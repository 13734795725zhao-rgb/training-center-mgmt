<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 培训机构管理系统</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-body">
  <div class="login-bg">
    <div class="login-bg-shape s1"></div>
    <div class="login-bg-shape s2"></div>
    <div class="login-bg-shape s3"></div>
  </div>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">&lt;/&gt;</div>
      <h1>培训机构管理系统</h1>
      <p>请登录以继续使用</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">用户名 <span class="req">*</span></label>
        <input type="text" id="username" class="form-input" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">密码 <span class="req">*</span></label>
        <div class="password-wrap">
          <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password" required>
          <button type="button" class="pwd-toggle" onclick="togglePwd()">显</button>
        </div>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary btn-lg login-btn" id="loginBtn">登 录</button>
    </form>
  </div>

  <script src="/static/js/common.js"></script>
  <script>
    function togglePwd() {
      const inp = document.getElementById("password");
      const btn = event.target;
      if (inp.type === "password") { inp.type = "text"; btn.textContent = "隐"; }
      else { inp.type = "password"; btn.textContent = "显"; }
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const errEl = document.getElementById("loginError");
      errEl.textContent = "";

      await withLock(document.getElementById("loginBtn"), async () => {
        const res = await apiFetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: {
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          },
        });
        if (!res) return;
        const data = await res.json();
        if (res.ok) {
          Toast.success("登录成功");
          if (data.force_change_password) {
            setTimeout(() => {
              window.location.href = "/settings?tab=password";
            }, 800);
          } else {
            setTimeout(() => window.location.href = "/", 800);
          }
        } else {
          errEl.textContent = data.error || "登录失败";
        }
      });
    });

    document.getElementById("username").focus();
  </script>
</body>
</html>

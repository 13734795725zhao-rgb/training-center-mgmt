<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Training Center Management System">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="0.6" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="-14%" r="92%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#312E81" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="94%" cy="116%" r="74%">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="#070B14"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#band)" opacity="0.95"/>

  <text x="88" y="90"
        font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="12.5" font-weight="700" letter-spacing="3.8" fill="#A5B4FC">MANAGEMENT SYSTEM</text>

  <text x="84" y="166"
        font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2.2" fill="url(#wordmark)">Training Center</text>

  <text x="88" y="208"
        font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" fill="#9FB0D0">Students, guardians, attendance, tuition and refunds —</text>

  <text x="88" y="236"
        font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" fill="#9FB0D0">one small Flask app, one SQLite file, no cloud.</text>

  <g font-family="'Cascadia Code', Consolas, ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="13.5" fill="#54648A">
    <text x="88" y="280">Flask</text>
    <text x="150" y="280">SQLite</text>
    <text x="220" y="280">Jinja2</text>
    <text x="294" y="280">openpyxl</text>
    <text x="382" y="280">RBAC</text>
    <text x="440" y="280">MIT</text>
  </g>

  <!-- dashboard mock -->
  <g>
    <rect x="762" y="62" width="442" height="212" rx="14" fill="url(#card)"
          stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>

    <!-- top bar -->
    <rect x="762" y="62" width="442" height="34" rx="14" fill="#FFFFFF" opacity="0.05"/>
    <rect x="762" y="82" width="442" height="14" fill="#FFFFFF" opacity="0.05"/>
    <circle cx="784" cy="79" r="3.6" fill="#6366F1" opacity="0.8"/>
    <circle cx="797" cy="79" r="3.6" fill="#22D3EE" opacity="0.6"/>
    <circle cx="810" cy="79" r="3.6" fill="#34D399" opacity="0.5"/>

    <!-- stat cards -->
    <g>
      <rect x="780" y="110" width="126" height="56" rx="9" fill="#FFFFFF" opacity="0.06"/>
      <rect x="792" y="122" width="46" height="6" rx="3" fill="#A5B4FC" opacity="0.75"/>
      <rect x="792" y="138" width="70" height="12" rx="4" fill="#FFFFFF" opacity="0.30"/>

      <rect x="920" y="110" width="126" height="56" rx="9" fill="#FFFFFF" opacity="0.06"/>
      <rect x="932" y="122" width="40" height="6" rx="3" fill="#67E8F9" opacity="0.75"/>
      <rect x="932" y="138" width="58" height="12" rx="4" fill="#FFFFFF" opacity="0.30"/>

      <rect x="1060" y="110" width="126" height="56" rx="9" fill="#FFFFFF" opacity="0.06"/>
      <rect x="1072" y="122" width="52" height="6" rx="3" fill="#6EE7B7" opacity="0.75"/>
      <rect x="1072" y="138" width="64" height="12" rx="4" fill="#FFFFFF" opacity="0.30"/>
    </g>

    <!-- chart -->
    <rect x="780" y="180" width="266" height="78" rx="9" fill="#FFFFFF" opacity="0.05"/>
    <g fill="#22D3EE" opacity="0.55">
      <rect x="798" y="228" width="14" height="20" rx="3"/>
      <rect x="822" y="216" width="14" height="32" rx="3"/>
      <rect x="846" y="236" width="14" height="12" rx="3"/>
      <rect x="870" y="208" width="14" height="40" rx="3"/>
      <rect x="894" y="222" width="14" height="26" rx="3"/>
      <rect x="918" y="200" width="14" height="48" rx="3"/>
      <rect x="942" y="220" width="14" height="28" rx="3"/>
      <rect x="966" y="210" width="14" height="38" rx="3"/>
    </g>

    <!-- side list -->
    <rect x="1060" y="180" width="126" height="78" rx="9" fill="#FFFFFF" opacity="0.05"/>
    <g fill="#FFFFFF" opacity="0.22">
      <rect x="1072" y="194" width="86" height="6" rx="3"/>
      <rect x="1072" y="210" width="70" height="6" rx="3"/>
      <rect x="1072" y="226" width="80" height="6" rx="3"/>
      <rect x="1072" y="242" width="60" height="6" rx="3"/>
    </g>
  </g>

  <rect x="0" y="317" width="1280" height="1" fill="#FFFFFF" opacity="0.06"/>
</svg>
